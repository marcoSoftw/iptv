<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarcoSoft TV</title>
    <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
    <style>
        /* Estilos minimalistas y funcionales */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #0a0a0a;
            color: white;
            padding: 10px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            padding: 15px;
            margin-bottom: 20px;
            background: #111;
            border-radius: 8px;
            border: 1px solid #333;
        }
        
        h1 {
            color: #4CAF50;
            margin-bottom: 5px;
        }
        
        .main {
            display: flex;
            gap: 20px;
        }
        
        @media (max-width: 1024px) {
            .main {
                flex-direction: column;
            }
        }
        
        .player-section {
            flex: 3;
        }
        
        .channels-section {
            flex: 1;
            min-width: 300px;
        }
        
        .video-container {
            background: black;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        
        #my-video {
            width: 100%;
            height: 400px;
        }
        
        .channel-list {
            background: #111;
            border-radius: 8px;
            overflow: hidden;
            height: 500px;
            display: flex;
            flex-direction: column;
        }
        
        .channels-header {
            padding: 15px;
            background: #222;
            text-align: center;
            border-bottom: 2px solid #4CAF50;
        }
        
        .channels-container {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        
        .channel-btn {
            display: block;
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 8px;
            background: #222;
            border: none;
            color: white;
            text-align: left;
            cursor: pointer;
            border-radius: 5px;
            border-left: 4px solid #333;
        }
        
        .channel-btn:hover {
            background: #2a2a2a;
        }
        
        .channel-btn.active {
            background: #1B5E20;
            border-left-color: #4CAF50;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .btn {
            padding: 10px 15px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            flex: 1;
        }
        
        .btn:hover {
            background: #388E3C;
        }
        
        .btn:disabled {
            background: #555;
            cursor: not-allowed;
        }
        
        .info {
            padding: 15px;
            background: #111;
            border-radius: 8px;
            margin-top: 15px;
        }
        
        .status {
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
            display: none;
        }
        
        .status.show {
            display: block;
        }
        
        .status.info {
            background: #2196F3;
        }
        
        .status.success {
            background: #4CAF50;
        }
        
        .status.error {
            background: #f44336;
        }
        
        .channel-info {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 14px;
            color: #aaa;
        }
        
        /* Scrollbar */
        .channels-container::-webkit-scrollbar {
            width: 8px;
        }
        
        .channels-container::-webkit-scrollbar-track {
            background: #222;
        }
        
        .channels-container::-webkit-scrollbar-thumb {
            background: #4CAF50;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>MarcoSoft TV</h1>
        </div>
        
        <div class="main">
            <div class="player-section">
                <div class="video-container">
                    <video id="my-video" class="video-js vjs-default-skin" controls preload="auto">
                        <p class="vjs-no-js">
                            Necesitas JavaScript para ver TV
                        </p>
                    </video>
                </div>
                
                <div class="controls">
                    <button class="btn" id="prev-btn" disabled>← Anterior</button>
                    <button class="btn" id="reload-btn">Recargar</button>
                    <button class="btn" id="next-btn" disabled>Siguiente →</button>
                </div>
                
                <div class="status" id="status">
                    Cargando lista de canales...
                </div>
                
                <div class="info">
                    <div id="current-channel">Selecciona un canal</div>
                    <div class="channel-info">
                        <span>Total: <span id="total-channels">0</span> canales</span>
                        <span>Canal: <span id="current-number">-</span></span>
                    </div>
                </div>
            </div>
            
            <div class="channels-section">
                <div class="channel-list">
                    <div class="channels-header">
                        <h3>Canales Disponibles</h3>
                    </div>
                    <div class="channels-container" id="channels-container">
                        <!-- Los canales se cargarán aquí -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
    
    <script>
        // Variables globales
        let player;
        let channels = [];
        let currentChannelIndex = -1;
        
        // Inicializar
        document.addEventListener('DOMContentLoaded', function() {
            // Inicializar reproductor SIMPLE
            player = videojs('my-video', {
                controls: true,
                autoplay: false,
                preload: 'auto',
                fluid: true
            });
            
            // Cargar canales
            loadChannels();
            
            // Botones
            document.getElementById('prev-btn').onclick = prevChannel;
            document.getElementById('next-btn').onclick = nextChannel;
            document.getElementById('reload-btn').onclick = reloadChannel;
            
            // Teclado
            document.addEventListener('keydown', function(e) {
                if (e.key === 'ArrowLeft') prevChannel();
                if (e.key === 'ArrowRight') nextChannel();
                if (e.key === ' ') {
                    e.preventDefault();
                    if (player.paused()) player.play();
                    else player.pause();
                }
            });
            
            // Errores del reproductor
            player.on('error', function() {
                const error = player.error();
                if (error) {
                    showStatus('Error: Stream no disponible', 'error');
                }
            });
        });
        
        // Cargar canales desde JSON
        async function loadChannels() {
            try {
                showStatus('Cargando canales...', 'info');
                
                const response = await fetch('channels.json');
                const data = await response.json();
                
                channels = data.channels.map((channel, index) => ({
                    ...channel,
                    number: index + 1
                }));
                
                console.log('Canales cargados:', channels.length);
                
                if (channels.length === 0) {
                    showStatus('No hay canales', 'error');
                    return;
                }
                
                // Mostrar canales
                displayChannels();
                showStatus(`Lista cargada: ${channels.length} canales`, 'success');
                
                // Reproducir primer canal
                setTimeout(() => playChannel(0), 500);
                
            } catch (error) {
                console.error('Error:', error);
                showStatus('Error cargando canales', 'error');
                
                // Cargar ejemplo si falla
                loadExampleChannels();
            }
        }
        
        // Cargar canales de ejemplo
        function loadExampleChannels() {
            channels = [
                {
                    name: "Nature Channel",
                    url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",
                    category: "Documentales",
                    number: 1
                },
                {
                    name: "Music Live",
                    url: "https://test-streams.mux.dev/test_001/stream_1000k_48k_640x360.m3u8",
                    category: "Música",
                    number: 2
                },
                {
                    name: "Sports TV",
                    url: "https://test-streams.mux.dev/test_002/stream_1000k_48k_640x360.m3u8",
                    category: "Deportes",
                    number: 3
                }
            ];
            
            displayChannels();
            showStatus('Canales de ejemplo cargados', 'info');
            
            setTimeout(() => playChannel(0), 500);
        }
        
        // Mostrar canales
        function displayChannels() {
            const container = document.getElementById('channels-container');
            
            if (channels.length === 0) {
                container.innerHTML = '<div style="padding: 20px; text-align: center; color: #aaa;">No hay canales</div>';
                return;
            }
            
            let html = '';
            channels.forEach((channel, index) => {
                const isActive = currentChannelIndex === index;
                html += `
                    <button class="channel-btn ${isActive ? 'active' : ''}" 
                            onclick="playChannel(${index})">
                        ${channel.number}. ${channel.name}
                        ${channel.category ? `<span style="float:right; color:#888; font-size:12px;">${channel.category}</span>` : ''}
                    </button>
                `;
            });
            
            container.innerHTML = html;
            
            // Actualizar contador
            document.getElementById('total-channels').textContent = channels.length;
        }
        
        // Reproducir canal - SIN PROXY
        function playChannel(index) {
            if (index < 0 || index >= channels.length) return;
            
            currentChannelIndex = index;
            const channel = channels[index];
            
            // Actualizar info
            document.getElementById('current-channel').textContent = channel.name;
            document.getElementById('current-number').textContent = channel.number;
            
            // Ocultar errores previos
            hideStatus();
            
            console.log('Reproduciendo:', channel.name);
            console.log('URL:', channel.url);
            
            // Cargar stream DIRECTO - SIN PROXY
            player.src({
                src: channel.url,
                type: 'application/x-mpegURL'
            });
            
            // Reproducir
            player.play().then(() => {
                console.log('Stream cargado');
                showStatus(`Reproduciendo: ${channel.name}`, 'success');
                setTimeout(hideStatus, 2000);
            }).catch(error => {
                console.error('Error:', error);
                showStatus(`Error: ${channel.name} no disponible`, 'error');
            });
            
            // Actualizar UI
            displayChannels();
            updateNavigation();
        }
        
        // Navegación
        function prevChannel() {
            if (currentChannelIndex > 0) {
                playChannel(currentChannelIndex - 1);
            }
        }
        
        function nextChannel() {
            if (currentChannelIndex < channels.length - 1) {
                playChannel(currentChannelIndex + 1);
            }
        }
        
        function reloadChannel() {
            if (currentChannelIndex >= 0) {
                const channel = channels[currentChannelIndex];
                showStatus(`Recargando: ${channel.name}`, 'info');
                playChannel(currentChannelIndex);
            }
        }
        
        function updateNavigation() {
            document.getElementById('prev-btn').disabled = currentChannelIndex <= 0;
            document.getElementById('next-btn').disabled = currentChannelIndex >= channels.length - 1;
        }
        
        // Mostrar/ocultar estado
        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status show ${type}`;
            
            if (type !== 'info') {
                setTimeout(hideStatus, 3000);
            }
        }
        
        function hideStatus() {
            document.getElementById('status').className = 'status';
        }
    </script>
</body>
</html>
